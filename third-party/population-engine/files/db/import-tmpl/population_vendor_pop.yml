# Population Vendor Population Database — import stub.
#
# Copied into db/import by `make import`, the same way rAthena's own stubs are,
# so db/population_vendor_pop.yml can import db/import/population_vendor_pop.yml
# unconditionally. An import that names a file which is not there is an error on
# every start, which is what this empty stub prevents when no mod ships vendor
# shell profiles.
#
# A mod's db/population_vendor_pop.yml replaces this file. For a vendor with
# Spawns: (see population_vendors.yml), give it a PlacementBound profile with the
# same VendorKey. Such a profile is looked up by its key, not its job, so it can
# use any vending job (Merchant tree, Super/Hyper Novice) without displacing the
# engine's own vendor of that job; its single Jobs: entry is the sprite.
# See the shipped db/population_vendor_pop.yml for the full schema.

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

