# RAGNAROKMAC — low-tier sets
#
# Everything upstream ships is Paradise/Eden gear, whose weapons start at
# equip level 26. pc_equipitem enforces that, so a low-level shell handed a
# para set silently equips nothing and stands on the map unarmed. These use
# plain level 1-4 equipment so a newbie-band shell is actually dressed and
# actually fights.
