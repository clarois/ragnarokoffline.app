# Exp Cards -- two tiered families in the 50000-99999 block docs/MODDING.md
# reserves for mods' items: stock rAthena has nothing there (its items sit
# below 32409 and from 100000 up), so no rAthena update will collide. Dropped by npc/exp_card.txt on a small chance
# from any mob kill, bound to the killer via makeitemowned.
#
# Ids are laid out in two contiguous ranges so the on-kill script can pick
# an item by simple arithmetic (base id + level):
#
#   50051..50060  Base_Exp_Card_1  .. Base_Exp_Card_10   -- grant BASE exp
#   50061..50070  Job_Exp_Card_1   .. Job_Exp_Card_10    -- grant JOB exp
#
# Exp per card at a 1x rate is a roughly geometric curve, anchored at
# Lv 10 = 60,000 (~5% of the Renewal level-98 base-exp requirement,
# ~1.25M in db/re/job_exp.yml). Each level down halves-or-so, matching
# the shape of rAthena's own NextBaseExp curve -- so a Lv 1 card at
# player level 5 is roughly the same 3-5% chunk of the next level that a
# Lv 10 card is at player level 98:
#
#   Lv 1  ->     100      Lv 6  ->  4,000
#   Lv 2  ->     250      Lv 7  ->  7,500
#   Lv 3  ->     500      Lv 8  -> 15,000
#   Lv 4  ->   1,000      Lv 9  -> 30,000
#   Lv 5  ->   2,000      Lv 10 -> 60,000
#
# Job cards use the same numbers on the job axis. If you want a different
# curve, edit the twenty scripts below.
#
# Each amount is scaled by the server's kill-exp rate -- base_exp_rate for
# Base cards, job_exp_rate for Job cards, read live with getbattleflag --
# so a card stays the same share of the exp a kill gives at any rate. It
# is granted with getexp2, not getexp: getexp would multiply by
# quest_exp_rate on top, and its other adjustments (guild exp tax, Battle
# Manuals) would make the "+N" message disagree with what was granted.
# getexp2 grants exactly .@exp, so the message is always the real number.
# The client tooltip (System/itemInfo.lua) cannot know the rate, so it
# names no number at all.
#
# EquipLevelMin gates use to a player who is at least "expected level for
# this tier". rAthena's pc_isUseitem checks it before consuming the item,
# so a low-level player who picks up a Lv 10 card just carries it around
# until they hit the level. The gate is (card_level - 1) * 10 + 1:
#
#   Lv 1 -> 1     Lv 6  -> 51
#   Lv 2 -> 11    Lv 7  -> 61
#   Lv 3 -> 21    Lv 8  -> 71
#   Lv 4 -> 31    Lv 9  -> 81
#   Lv 5 -> 41    Lv 10 -> 91
#
# Version 3 is the ITEM_DB version this build reads; take it from the
# header of vendor/rathena/db/import-tmpl/item_db.yml if you retarget.
Header:
  Type: ITEM_DB
  Version: 3

Body:
  # -- Base Exp Cards ------------------------------------------------------
  - Id: 50051
    AegisName: Base_Exp_Card_1
    Name: Base Exp Card Lv1
    Type: Usable
    Buy: 0
    Weight: 1
    EquipLevelMin: 1
    Script: |
      .@exp = 100 * getbattleflag("base_exp_rate") / 100;
      if (.@exp > 0) getexp2 .@exp, 0;
      dispbottom "Base Exp Card Lv1: +" + callfunc("F_InsertComma", .@exp) + " base experience.";

