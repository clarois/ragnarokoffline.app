###########################################################################
# prontera-vendors — vendor definitions
# GENERATED by registry/tools/prontera-vendors/build_vendors.py from rAthena's item, monster and
# spawn databases and iRO market prices. Edit by hand if you like, but a
# re-run overwrites this file; lasting changes belong in the script.
###########################################################################
#
# One Pool vendor per theme. Each stall draws PickCount items from its Pool
# with prices rolled inside each item's [min, max] (sometimes just under the
# cheapest rival stall, never below the NPC sell price), and on a rare
# 1-in-5000 per item lists one with a digit missing.
#
# The first entry is the market: its spots on both Prontera sidewalks, and
# the themes a spot may roll (Weight, Min, Max) each time a stall is put
# there. Its Count is replaced by the mod's "Sell stalls" setting; rotation
# and callouts come from the settings too, and the values here are what
# applies without them. The themes after it sell; they have no Spawns.
###########################################################################

